<!DOCTYPE html><html lang="fa" dir="rtl"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1">  <style>    body { background-color: lightblue; font-family: Tahoma, sans-serif; }    h1 { color: darkblue; text-align: center; }    .cart { text-align: center; font-size: 18px; font-weight: bold; color: darkblue; }    .product { background-color: white; padding: 15px; margin: 10px; border-radius: 10px; text-align: center; }    button { background-color: green; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 16px; }    button:hover { background-color: darkgreen; }    footer { text-align: center; color: darkblue; padding: 15px; }  </style></head><body><h1>فروشگاه لوازم خانگی</h1><p style="text-align:center;">بهترین لوازم برای خونه‌ی شما</p><p class="cart">🛒 تعداد در سبد خرید: <span id="cart-count">0</span></p><div class="product">  <h2>یخچال سامسونگ</h2>  <p>قیمت: ۲۰ میلیون تومان</p>  <img src="https://placehold.co/300x200?text=Yakhchal" alt="یخچال سامسونگ">  <br><br>  <button onclick="addToCart()">افزودن به سبد خرید</button></div><div class="product">  <h2>ماشین لباسشویی ال‌جی</h2>  <p>قیمت: ۱۵ میلیون تومان</p>  <img src="https://placehold.co/300x200?text=Lebasshooyi" alt="ماشین لباسشویی ال‌جی">  <br><br>  <button onclick="addToCart()">افزودن به سبد خرید</button></div><div class="product">  <h2>جاروبرقی بوش</h2>  <p>قیمت: ۵ میلیون تومان</p>  <img src="https://placehold.co/300x200?text=Jaroobarghi" alt="جاروبرقی بوش">  <br><br>  <button onclick="addToCart()">افزودن به سبد خرید</button></div><footer>  <p>تلفن تماس: ۰۹۱۲۰۰۰۰۰۰۰</p></footer><script>  var count = 0;  function addToCart() {    count = count + 1;    document.getElementById("cart-count").innerText = count;  }</script></body></html>
